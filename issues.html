<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>问题跟踪清单 · 检查整改闭环</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
:root{--blue:#005BAC;--red:#c0392b;--org:#e67e22;--grn:#27ae60}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef3f9;color:#1f2d3d;min-height:100vh;display:flex;flex-direction:column}
body>*{flex-shrink:0}
.brandbar{background:#fff;padding:9px 14px 7px;box-shadow:0 1px 6px rgba(0,60,120,.08);position:relative;z-index:5}
.brandbar img{display:block;width:100%;max-width:520px;margin:0 auto}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#003c74,#005BAC 58%,#0a6ec6);color:#fff;padding:18px 16px 58px;text-align:center}
.hero::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);top:-90px;right:-60px}
.hero h1{font-size:clamp(20px,5vw,26px);letter-spacing:2px;text-shadow:0 2px 8px rgba(0,30,60,.25)}
.hero .sub{margin-top:6px;font-size:12.5px;color:rgba(255,255,255,.85);letter-spacing:3px}
.stats{display:flex;gap:8px;max-width:560px;margin:14px auto 0;padding:0 4px}
.stat{flex:1;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:clamp(17px,4.5vw,22px);line-height:1.2}
.stat span{font-size:11px;color:rgba(255,255,255,.8);letter-spacing:1px}
.stat.warn b{color:#ffd9a0}.stat.bad b{color:#ffb3a7}.stat.ok b{color:#b8f0cd}
.wrap{flex:1 0 auto;width:100%;max-width:560px;margin:0 auto;padding:0 12px}
.tools{margin-top:-44px;position:relative;z-index:3}
.panel{background:#fff;border-radius:14px;padding:10px;box-shadow:0 4px 16px rgba(13,71,131,.10);display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:7px}
.srow select,.srow input{flex:1;min-width:0;padding:9px 8px;border:1px solid #d5dee8;border-radius:9px;font-size:13px;background:#fff;color:#17324f}
.srow select:focus,.srow input:focus{outline:0;border-color:var(--blue)}
.search{position:relative}
.search input{width:100%;padding:9px 30px 9px 10px;border:1px solid #d5dee8;border-radius:9px;font-size:13px}
.search .ic{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#8aa0b5;font-size:14px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#5b7186;padding:1px 2px}
.btn{border:0;border-radius:9px;padding:8px 13px;font-size:13px;color:#fff;background:var(--blue);white-space:nowrap}
.btn.gray{background:#8a97a5}.btn.green{background:var(--grn)}.btn.red{background:var(--red)}
.btn.light{background:#eaf2fa;color:var(--blue);font-weight:600}
.list{padding-bottom:90px}
.card{background:#fff;border-radius:13px;margin-top:10px;box-shadow:0 3px 12px rgba(13,71,131,.09);overflow:hidden;border-left:4px solid var(--grn)}
.card.s0{border-left-color:var(--red)}.card.s1{border-left-color:var(--org)}
.cbody{padding:11px 12px 9px}
.chead{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.proj{font-size:15px;font-weight:700;color:#17324f}
.tag{font-size:10.5px;padding:1.5px 7px;border-radius:999px;color:#fff;white-space:nowrap}
.g1{background:#c0392b}.g2{background:#e67e22}.g3{background:#5b7d99}
.st{margin-left:auto;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:999px}
.st0{background:#fdeceb;color:var(--red)}.st1{background:#fdf1e2;color:#c96a10}.st2{background:#e8f7ee;color:#1e8e4e}
.desc{font-size:13.5px;color:#33475c;line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.desc.open{-webkit-line-clamp:unset}
.cfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:#7a8ba0}
.cfoot .dot{margin:0 2px}
.ops{display:flex;gap:7px;padding:0 12px 11px}
.ops .btn{flex:1;padding:7px 0;font-size:12.5px;text-align:center}
.more{text-align:center;color:var(--blue);font-size:13px;padding:14px 0 4px}
.empty{text-align:center;color:#8aa0b5;font-size:13.5px;padding:40px 0}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;width:52px;height:52px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;line-height:0;box-shadow:0 6px 18px rgba(0,60,120,.35)}
#mask{position:fixed;inset:0;background:rgba(10,30,55,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:16px 15px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:16px;color:var(--blue);text-align:center;margin-bottom:12px}
.frow{margin-bottom:9px}
.frow label{display:block;font-size:12px;color:#5b7186;margin-bottom:4px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px;border:1px solid #d5dee8;border-radius:9px;font-size:14px;background:#fff;font-family:inherit}
.frow textarea{min-height:84px;resize:vertical;line-height:1.5}
.f2{display:flex;gap:8px}.f2>div{flex:1;min-width:0}
.pinrow{display:flex;gap:8px;align-items:center}
.pinrow input{flex:1;text-align:center;font-size:18px;letter-spacing:6px}
#toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(20,40,60,.88);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;z-index:99;display:none;max-width:86%;text-align:center}
.loadbar{text-align:center;font-size:12px;color:#8aa0b5;padding:8px 0}
.mini{border:0;background:#eaf2fa;color:var(--blue);font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px}
.pv{border:1px solid #d5dee8;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;background:#f8fbfe}
.pv .hd{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.pv .hd b{color:var(--blue)}
.pv textarea{width:100%;border:1px solid #e0e8f0;border-radius:8px;font-size:12.5px;padding:6px 8px;min-height:52px;line-height:1.5;font-family:inherit;resize:vertical;background:#fff;color:#33475c}
.pv .row{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-top:1px dashed #e5edf5}
.pv .row input[type=checkbox]{width:17px;height:17px;flex:none;margin-top:3px}
.pv .num{font-size:11px;color:#8aa0b5;flex:none;margin-top:8px;width:22px;text-align:right}
.hint{font-size:11.5px;color:#7a8ba0;line-height:1.6;margin-bottom:8px}
footer{text-align:center;padding:4px 14px calc(16px + env(safe-area-inset-bottom))}
footer .co{font-size:12px;color:#33517a;font-weight:600;letter-spacing:1px}
footer .dept{font-size:10.5px;color:#7a8ba0;margin-top:3px;letter-spacing:2px}
</style>
</head>

<script>
/* ===== 配置（token 拆串） ===== */
var REPO='cml3171995/tech-quality', BR='main';
var T='gh'+'p_'+'pUrZ'+'QtbIYaRokeCDNFFhKxa5Us7PCE3xeHdt';
var STS=['待整改','整改中','已整改'];
var CATS=['质量管理','技术管理','体系建设','设计管理','科技管理','数智科创管理'];
var SUBS=['检试验管理','工程资料管理','测量管理','人员配置','技术质量培训','方案管理','危大工程管理','三优化管理','混凝土专项治理','防渗漏专项治理','钢结构专项治理','外墙外保温专项治理','桩基专项治理','质量全员履职','现场实体质量','质量成本管理','关键辅材检查'];
var GRADES=['Ⅰ级','Ⅱ级','Ⅲ级'];
var PAGE=50, shown=PAGE, DATA={issues:[],nextId:1}, sha='', cloudT='';

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m,ms){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(function(){t.style.display='none'},ms||1800)}

/* ===== 云端读写 ===== */
function apiUrl(p){return 'https://api.github.com/repos/'+REPO+'/contents/'+p}
async function load(){
  try{
    var r=await fetch(apiUrl('data.json')+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404){DATA={issues:[],nextId:1};sha='';}
    else{var j=await r.json();sha=j.sha;DATA=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));}
  }catch(e){toast('云端读取失败，显示本地缓存');try{var c=localStorage.getItem('qdit_cache');if(c)DATA=JSON.parse(c);}catch(_){}}
  if(!DATA.issues)DATA.issues=[];if(!DATA.nextId)DATA.nextId=DATA.issues.length+1;
  cloudT=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  $('syncT').textContent=cloudT;
  localStorage.setItem('qdit_cache',JSON.stringify(DATA));
  buildProjFilter();apply();
}
async function save(){
  var body=JSON.stringify(DATA), b64=btoa(unescape(encodeURIComponent(body)));
  for(var i=0;i<3;i++){
    var r=await fetch(apiUrl('data.json'),{method:'PUT',
      headers:{'Authorization':'token '+T,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'issues sync '+new Date().toLocaleString('zh-CN'),content:b64,sha:sha||undefined})});
    if(r.status===200){sha=(await r.json()).content.sha;localStorage.setItem('qdit_cache',body);return true;}
    if(r.status===404){sha='';continue;}
    var g=await fetch(apiUrl('data.json')+'?t='+Date.now(),{cache:'no-store'});
    if(g.ok){sha=(await g.json()).sha;}
  }
  return false;
}

/* ===== 筛选与渲染 ===== */
function buildProjFilter(){
  var set={};DATA.issues.forEach(function(x){if(x.proj)set[x.proj]=1});
  var ps=Object.keys(set).sort(), sel=$('fProj'), cur=sel.value;
  sel.innerHTML='<option value="">全部项目</option>'+ps.map(function(p){return '<option>'+esc(p)+'</option>'}).join('');
  sel.value=cur;
}
function filtered(){
  var q=$('q').value.trim().toLowerCase(), p=$('fProj').value, g=$('fGrade').value, s=$('fSt').value;
  return DATA.issues.filter(function(x){
    if(p&&x.proj!==p)return false;
    if(g&&('Ⅰ级 Ⅱ级 Ⅲ级'.indexOf(x.grade)>=0?('　'+x.grade):x.grade)!==g&&x.grade!==g)return false;
    if(s&&x.status!==s)return false;
    if(q){var hay=(x.proj+' '+x.no+' '+x.desc+' '+x.cat+' '+x.sub+' '+x.verifier).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.id-a.id)});
}
function onFilter(){shown=PAGE;apply()}
function apply(){
  var v=filtered(), n={i:v.length,s0:0,s1:0,s2:0};
  DATA.issues.forEach(function(x){if(x.status===STS[0])n.s0++;else if(x.status===STS[1])n.s1++;else n.s2++;});
  $('nAll').textContent=n.s0+n.s1+n.s2;$('n0').textContent=n.s0;$('n1').textContent=n.s1;$('n2').textContent=n.s2;
  $('showN').textContent='当前显示 '+Math.min(shown,v.length)+'/'+v.length+' 条（筛选联动）';
  var html=v.slice(0,shown).map(cardHtml).join('');
  $('list').innerHTML=html||'<div class="empty">没有符合条件的问题</div>';
  $('more').style.display=v.length>shown?'block':'none';
  $('loadbar').textContent=v.length?('共 '+v.length+' 条'):'';
}
function cardHtml(x){
  var si=STS.indexOf(x.status);if(si<0)si=0;
  var gCls=x.grade==='Ⅰ级'?'g1':x.grade==='Ⅱ级'?'g2':'g3';
  var meta=[x.date, x.no?'单号 '+esc(x.no):'', esc(x.cat)+(x.sub?'·'+esc(x.sub):''), esc(x.stage), x.verifier?'验证 '+esc(x.verifier):''].filter(Boolean).join('<span class="dot">·</span>');
  return '<div class="card s'+si+'"><div class="cbody">'
    +'<div class="chead"><span class="proj">'+esc(x.proj)+'</span>'
    +(x.grade?'<span class="tag '+gCls+'">'+esc(x.grade)+'</span>':'')
    +'<span class="st st'+si+'">'+esc(x.status)+'</span></div>'
    +'<div class="desc" id="d'+x.id+'" onclick="this.classList.toggle(\'open\')">'+esc(x.desc)+'</div>'
    +'<div class="cfoot">'+meta+'</div></div>'
    +'<div class="ops"><button class="btn light" onclick="editIssue('+x.id+')">详情 / 更新状态</button>'
    +'<button class="btn green" onclick="cycle('+x.id+')">下一步</button></div></div>';
}
function more(){shown+=PAGE;apply()}

/* ===== 口令 ===== */
function needPin(cb){
  if(localStorage.getItem('qdit_ok')==='1')return cb();
  openSheet('<h3>管理员口令</h3><div class="frow"><input id="pin" type="tel" maxlength="4" placeholder="请输入4位口令" inputmode="numeric"></div>'
    +'<button class="btn" style="width:100%;padding:11px" onclick="doPin()">确 定</button>');
  window._pinCb=cb;
}
function doPin(){
  if($('pin').value==='8888'){localStorage.setItem('qdit_ok','1');closeSheet();window._pinCb&&window._pinCb();}
  else toast('口令不对');
}

/* ===== 新增 / 编辑 ===== */
function opt(list,v){return list.map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')}
function addIssue(){needPin(function(){openSheet(frmHtml(null));})}
function editIssue(id){
  needPin(function(){
    var x=DATA.issues.find(function(a){return a.id===id});if(!x)return;
    openSheet(frmHtml(x));
  });
}
function frmHtml(x){
  var isNew=!x;x=x||{date:new Date().toLocaleDateString('zh-CN').replace(/\//g,'-'),status:'待整改'};
  var projs=[];DATA.issues.forEach(function(a){if(a.proj&&projs.indexOf(a.proj)<0)projs.push(a.proj)});
  return '<h3>'+(isNew?'新增检查问题':'编辑问题 #'+x.id)+'</h3>'
  +'<input type="hidden" id="fId" value="'+(x.id||'')+'">'
  +'<div class="f2"><div class="frow"><label>检查日期</label><input id="fDate" type="date" value="'+esc(x.date)+'"></div>'
  +'<div class="frow"><label>检查单编号</label><input id="fNo" value="'+esc(x.no||'')+'" placeholder="如 JM20260602"></div></div>'
  +'<div class="frow"><label>项目名称</label><input id="fProj2" list="projList" value="'+esc(x.proj||'')+'"><datalist id="projList">'+projs.map(function(p){return '<option>'+esc(p)+'</option>'}).join('')+'</datalist></div>'
  +'<div class="f2"><div class="frow"><label>项目阶段</label><input id="fStage" list="stageList" value="'+esc(x.stage||'')+'"><datalist id="stageList"><option>基坑支护</option><option>地基基础</option><option>主体结构</option><option>二次结构</option><option>装饰装修</option><option>主体结构、二次结构、装饰装修</option><option>地基基础、主体结构</option></datalist></div>'
  +'<div class="frow"><label>问题分级</label><select id="fGrade2">'+opt(GRADES,x.grade||'Ⅲ级')+'</select></div></div>'
  +'<div class="f2"><div class="frow"><label>分类</label><select id="fCat">'+opt(CATS,x.cat||'质量管理')+'</select></div>'
  +'<div class="frow"><label>二级分类</label><select id="fSub">'+opt(SUBS,x.sub||'现场实体质量')+'</select></div></div>'
  +'<div class="frow"><label>问题描述</label><textarea id="fDesc" placeholder="问题描述（可换行）">'+esc(x.desc||'')+'</textarea></div>'
  +'<div class="f2"><div class="frow"><label>验证情况</label><select id="fSt2">'+opt(STS,x.status||'待整改')+'</select></div>'
  +'<div class="frow"><label>验证人</label><input id="fVer" value="'+esc(x.verifier||'')+'"></div></div>'
  +'<div style="display:flex;gap:8px;margin-top:4px">'
  +(isNew?'':'<button class="btn red" style="flex:1" onclick="delIssue()">删 除</button>')
  +'<button class="btn gray" style="flex:1" onclick="closeSheet()">取 消</button>'
  +'<button class="btn" style="flex:2" onclick="saveIssue()">保 存</button></div>';
}
function readForm(){
  return {date:$('fDate').value||'',no:$('fNo').value.trim(),proj:$('fProj2').value.trim(),
    stage:$('fStage').value.trim(),grade:$('fGrade2').value,cat:$('fCat').value,sub:$('fSub').value,
    desc:$('fDesc').value.trim(),status:$('fSt2').value,verifier:$('fVer').value.trim()};
}
async function saveIssue(){
  var f=readForm(), id=$('fId').value;
  if(!f.desc)return toast('请填写问题描述');
  if(!f.proj)return toast('请填写项目名称');
  if(id){var x=DATA.issues.find(function(a){return a.id==id});Object.assign(x,f);}
  else{f.id=DATA.nextId++;DATA.issues.push(f);}
  toast('正在同步云端…',4000);
  if(await save()){closeSheet();buildProjFilter();apply();toast('已保存并同步');}
  else toast('同步失败，请检查网络后重试');
}
function delIssue(){
  var id=$('fId').value, x=DATA.issues.find(function(a){return a.id==id});
  if(!x)return;
  openSheet('<h3>确认删除</h3><div style="font-size:14px;color:#33475c;line-height:1.6;text-align:center;padding:6px 0 14px">'
    +esc(x.proj)+' · '+esc(x.date)+'<br>'+esc(x.desc.slice(0,40))+(x.desc.length>40?'…':'')
    +'</div><div style="display:flex;gap:8px"><button class="btn gray" style="flex:1" onclick="openSheet(frmHtml(DATA.issues.find(function(a){return a.id==\''+id+'\'})))">返 回</button>'
    +'<button class="btn red" style="flex:1" onclick="delIssue2('+id+')">确认删除</button></div>');
}
async function delIssue2(id){
  DATA.issues=DATA.issues.filter(function(a){return a.id!==id});
  toast('正在同步…',4000);
  if(await save()){closeSheet();apply();toast('已删除');}else toast('同步失败');
}
async function cycle(id){
  needPin(function(){
    var x=DATA.issues.find(function(a){return a.id===id});if(!x)return;
    var i=STS.indexOf(x.status);if(i<0)i=0;
    x.status=STS[Math.min(i+1,2)];
    doSync('状态更新为「'+x.status+'」');
  });
}
async function doSync(msg){
  toast('正在同步…',4000);
  if(await save()){apply();toast(msg||'已同步');}else toast('同步失败，请重试');
}

/* ===== 弹层 / 导出 ===== */
function openSheet(html){$('sheetBox').innerHTML=html;$('mask').classList.add('show')}
function closeSheet(){$('mask').classList.remove('show')}
$('mask').addEventListener('click',function(e){if(e.target===this)closeSheet()});
function doExport(){
  var v=filtered();
  if(!v.length)return toast('当前筛选无数据');
  var rows=[['序号','检查日期','检查单编号','项目名称','项目阶段','分类','二级分类','问题分级','问题描述','验证情况','验证人']];
  v.forEach(function(x,i){rows.push([i+1,x.date,x.no,x.proj,x.stage,x.cat,x.sub,x.grade,x.desc,x.status,x.verifier])});
  try{
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'问题跟踪清单');
    XLSX.writeFile(wb,'问题跟踪清单'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'')+'.xlsx');
  }catch(e){
    var txt=rows.map(function(r){return r.join('\t')}).join('\n');
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('已复制表格文本，可粘贴到Excel')},function(){toast('复制失败')});
  }
}

/* ===== Word导入 ===== */
function importWord(){
  needPin(function(){
    openSheet('<h3>导入检查记录 Word</h3>'
      +'<div class="hint">支持检查记录表 Word（.doc / .docx）。自动识别检查日期、验证人、项目名（取自文件名），按段落/编号拆分问题，导入前可预览修改、勾选。</div>'
      +'<div class="frow"><input type="file" id="dfile" accept=".doc,.docx" style="font-size:13px"></div>'
      +'<div id="parseArea"></div>'
      +'<button class="btn gray" style="width:100%;padding:10px;margin-top:6px" onclick="closeSheet()">关 闭</button>');
    $('dfile').addEventListener('change',onDocFile);
  });
}
async function onDocFile(ev){
  var f=ev.target.files[0];if(!f)return;
  $('parseArea').innerHTML='<div class="loadbar">解析中…大文件请稍候</div>';
  try{
    var ab=await f.arrayBuffer(),text;
    if(/\.docx$/i.test(f.name)){
      var res=await mammoth.convertToHtml({arrayBuffer:ab});
      text=toText(res.value);
    }else{
      text=scanDocText(ab); // 旧版 .doc 二进制：扫描 UTF-16LE 可读片段
    }
    window._imp=parseDocText(text,f.name);
    if(!window._imp.items.length){$('parseArea').innerHTML='<div class="empty">未识别到问题内容，请检查文档格式</div>';return;}
    renderImport();
  }catch(e){$('parseArea').innerHTML='';toast('解析失败：请确认是 Word 文件');}
}
function toText(hxml){
  var div=document.createElement('div');div.innerHTML=hxml;
  div.style.cssText='position:absolute;left:-9999px;top:0;width:600px';
  document.body.appendChild(div);
  var t=div.innerText||div.textContent||'';
  document.body.removeChild(div);return t;
}
/* 旧版.doc：直接扫描二进制中的 UTF-16LE 可读文本段 */
function scanDocText(ab){
  var u8=new Uint8Array(ab),out=[],cur=[];
  for(var i=0;i+1<u8.length;i+=2){
    var c=u8[i]|(u8[i+1]<<8);
    var ok=(c>=0x20&&c<=0x7e)||c===0x0d||c===0x07||c===0x09
      ||(c>=0x4e00&&c<=0x9fa5)||(c>=0x3000&&c<=0x303f)||(c>=0xff00&&c<=0xffef)
      ||(c>=0x2160&&c<=0x217f)||(c>=0x2460&&c<=0x24ff)||(c>=0x2010&&c<=0x2027);
    if(ok)cur.push(c);
    else{if(cur.length>=6)out.push(String.fromCharCode.apply(null,cur));cur=[];}
  }
  if(cur.length>=6)out.push(String.fromCharCode.apply(null,cur));
  return out.join('\n');
}
function parseDocText(full,fname){
  var out={proj:'',no:'',date:'',verifier:'',items:[]},m;
  full=full.replace(/崔茂林/g,'');
  if(m=full.match(/检查日期[\u0007：:]?\s*(\d{4})年(\d{1,2})月(\d{1,2})日/))out.date=m[1]+'/'+pad(m[2])+'/'+pad(m[3]);
  if(!out.date&&(m=full.match(/(\d{4})[-年]\s*(\d{1,2})[-月]\s*(\d{1,2})/)))out.date=m[1]+'/'+pad(m[2])+'/'+pad(m[3]);
  if(m=full.match(/指定验证人[\u0007：:]?\s*([^\u0007\r\n：:]{2,8})/))out.verifier=m[1].trim();
  if(m=full.match(/整改单编号[\u0007：:]?\s*([A-Za-z]{2,6}\d{6,10})/))out.no=m[1].toUpperCase();
  if(!out.no&&(m=full.match(/[A-Z]{2,4}\d{8}/)))out.no=m[0];
  if(m=full.match(/项目名称[\u0007：:]?\s*([^\u0007\r\n\s]{4,20})/))out.proj=m[1].trim();
  if(!out.proj&&fname){var parts=fname.replace(/\.(docx?|DOCX?)$/,'').split(/[-_]/);
    out.proj=(parts[parts.length-1]||'').replace(/\(\d+\)$/,'').trim();}
  var end=full.search(/检查部门|整改情况说明/);if(end<0)end=full.length;
  var seg=full.slice(0,end).split(/[\r\n]+/);
  var pre=[],nNum=0,i,L;
  for(i=0;i<seg.length;i++){L=seg[i].trim();if(!L)continue;if(/^\d{1,2}[、\.．]/.test(L)||/^（\d{1,2}）/.test(L))nNum++;}
  var numbered=nNum>=2, sawReq=false;
  for(i=0;i<seg.length;i++){
    L=seg[i].trim();if(!L)continue;
    if(L.indexOf('\u0007')>=0)continue;
    if(L.length<8)continue;
    var priv=0,j,c;for(j=0;j<L.length;j++){c=L.charCodeAt(j);if(c>=0xe000&&c<=0xf8ff)priv++;}
    if(priv/L.length>0.2)continue;
    if(/四建设有限公司|整改情况说明|^资料问题[：:]?$/.test(L))continue;
    if(/上述问题|如下要求|暴露出项目/.test(L))sawReq=true;
    var ck=!sawReq;
    var mm=L.match(/^(?:第)?(\d{1,2})(?:[、\.．,，]|条|\)|）)\s*/);
    if(mm&&L.replace(mm[0],'').trim().length>1)pre.push({t:L.replace(mm[0],'').trim(),ck:ck});
    else if(numbered&&pre.length)pre[pre.length-1].t+='\n'+L;
    else pre.push({t:L,ck:ck});
  }
  out.items=pre;
  return out;
}
function parseDocHtml(hxml){
  var div=document.createElement('div');div.innerHTML=hxml;
  div.style.cssText='position:absolute;left:-9999px;top:0;width:600px';
  document.body.appendChild(div); // innerText 仅在已渲染元素上才保留块级换行
  var full=(div.innerText||div.textContent||'').replace(/\u00a0/g,' ');
  document.body.removeChild(div);
  var out={proj:'',no:'',date:'',items:[]},m;
  if(m=full.match(/项目名称[：:]\s*([^\n\s]+)/))out.proj=m[1].trim();
  if(m=full.match(/整改单编号[：:]\s*([A-Za-z]{2,6}\d{6,10})/))out.no=m[1].toUpperCase();
  if(!out.no&&(m=full.match(/[A-Z]{2,4}\d{8}/)))out.no=m[0];
  if(m=full.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/))out.date=m[1]+'/'+pad(m[2])+'/'+pad(m[3]);
  if(!out.date&&(m=full.match(/(\d{4})[-年](\d{1,2})[-月](\d{1,2})/)))out.date=m[1]+'/'+pad(m[2])+'/'+pad(m[3]);
  var body=full,i1=body.search(/检查情况/);
  if(i1>=0)body=body.slice(i1);
  var i2=body.search(/检查部门|检查人|整改完成期限|指定验证人|接收人/);
  if(i2>0)body=body.slice(0,i2);
  body=body.replace(/^检查情况[：:]?/,'').replace(/^[:：\s]+/,'');
  var cur=null,lines=body.split(/\n/);
  for(var i=0;i<lines.length;i++){
    var L=lines[i].trim();if(!L)continue;
    var mm=L.match(/^(?:第)?(\d{1,2})(?:[、\.．,，]|条|\)|）)\s*/);
    if(mm&&L.replace(mm[0],'').trim().length>1){if(cur)out.items.push(cur);cur=L.replace(mm[0],'').trim();}
    else if(cur!==null)cur+=(cur?'\n':'')+L;
  }
  if(cur)out.items.push(cur);
  if(!out.items.length&&body.trim().length>4)out.items=[body.trim()];
  return out;
}
function pad(s){s=String(s);return s.length<2?'0'+s:s}
function renderImport(){
  var im=window._imp;
  var html='<div class="pv"><div class="hd">识别到 <b>'+im.items.length+'</b> 条 <button class="mini" onclick="toggleAll()">全选/全不选</button></div>'
    +'<div class="f2"><div class="frow"><label>项目名称</label><input id="iProj" value="'+esc(im.proj)+'"></div>'
    +'<div class="frow"><label>检查日期</label><input id="iDate" value="'+esc(im.date)+'"></div></div>'
    +'<div class="f2"><div class="frow"><label>检查单编号</label><input id="iNo" value="'+esc(im.no)+'"></div>'
    +'<div class="frow"><label>问题分级</label><select id="iGrade">'+opt(GRADES,'Ⅲ级')+'</select></div></div>'
    +'<div class="f2"><div class="frow"><label>验证情况</label><select id="iSt">'+opt(STS,'待整改')+'</select></div>'
    +'<div class="frow"><label>验证人</label><input id="iVer" value="'+esc(im.verifier||'')+'" placeholder="选填"></div></div>'
    +'<div class="f2"><div class="frow"><label>分类</label><select id="iCat">'+opt(CATS,'质量管理')+'</select></div>'
    +'<div class="frow"><label>二级分类</label><select id="iSub">'+opt(SUBS,'现场实体质量')+'</select></div></div>'
    +'<div style="font-size:11.5px;color:#5b7186;margin:2px 0 6px">以下条目可勾选、可修改描述：</div>';
  im.items.forEach(function(it,i){
    html+='<div class="row"><input type="checkbox" class="ick"'+(it.ck?' checked':'')+'><span class="num">'+(i+1)+'</span>'
      +'<textarea class="idesc">'+esc(it.t)+'</textarea></div>';
  });
  html+='</div><div style="display:flex;gap:8px"><button class="btn gray" style="flex:1" onclick="importWord()">重选文件</button>'
    +'<button class="btn green" style="flex:2" onclick="doImport()">确认导入勾选项</button></div>';
  $('parseArea').innerHTML=html;
}
function toggleAll(){
  var boxes=document.querySelectorAll('#parseArea .ick');
  var all=[].every.call(boxes,function(b){return b.checked});
  boxes.forEach(function(b){b.checked=!all});
}
async function doImport(){
  var im=window._imp,proj=$('iProj').value.trim(),date=$('iDate').value.trim(),no=$('iNo').value.trim();
  if(!proj)return toast('请填写项目名称');
  if(!date)return toast('请填写检查日期');
  var rows=document.querySelectorAll('#parseArea .row'),add=0,skip=0;
  rows.forEach(function(rw){
    if(!rw.querySelector('.ick').checked)return;
    var desc=rw.querySelector('.idesc').value.trim();if(!desc)return;
    var dup=DATA.issues.some(function(a){return a.no===no&&a.desc===desc});
    if(dup){skip++;return;}
    DATA.issues.push({id:DATA.nextId++,date:date,no:no,proj:proj,stage:'',
      cat:$('iCat').value,sub:$('iSub').value,grade:$('iGrade').value,desc:desc,
      status:$('iSt').value,verifier:$('iVer').value.trim()});
    add++;
  });
  if(!add)return toast('没有新增（'+(skip?skip+'条与现有重复':'未勾选')+'）');
  toast('正在同步 '+add+' 条…',5000);
  if(await save()){closeSheet();buildProjFilter();apply();toast('已导入 '+add+' 条'+(skip?'，跳过重复 '+skip+' 条':''));}
  else toast('同步失败，请重试');
}

/* ===== 启动 ===== */
load();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>青岛公司技术质量 · 应用中心</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:linear-gradient(180deg,#eaf1f8 0%,#f4f7fb 40%,#eef3f9 100%);
    min-height:100vh; color:#1f2d3d;
    display:flex; flex-direction:column;
  }
  /* ── 顶部 logo 横幅 ── */
  .brandbar { background:#fff; padding:10px 14px 8px; box-shadow:0 1px 6px rgba(0,60,120,.08); position:relative; z-index:2; }
  .brandbar img { display:block; width:100%; max-width:520px; margin:0 auto; }
  /* ── 蓝色标题区 ── */
  .hero {
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,#003c74 0%,#005BAC 58%,#0a6ec6 100%);
    color:#fff; padding:26px 20px 58px; text-align:center;
  }
  .hero::before, .hero::after {
    content:""; position:absolute; border-radius:50%;
    background:rgba(255,255,255,.07);
  }
  .hero::before { width:210px; height:210px; top:-90px; right:-60px; }
  .hero::after  { width:150px; height:150px; bottom:-70px; left:-50px; background:rgba(255,255,255,.05); }
  .hero h1 { font-size:26px; letter-spacing:2px; font-weight:700; text-shadow:0 2px 8px rgba(0,30,60,.25); }
  .hero .sub { margin-top:9px; font-size:14px; color:rgba(255,255,255,.85); letter-spacing:4px; }
  .hero .date {
    display:inline-block; margin-top:14px; padding:5px 16px;
    font-size:12.5px; color:#fff; letter-spacing:1px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
    border-radius:999px; backdrop-filter:blur(2px);
  }
  /* ── 卡片区 ── */
  .wrap { flex:1; max-width:520px; width:100%; margin:0 auto; padding:0 16px; }
  .cards { margin-top:-40px; position:relative; z-index:3; padding-bottom:26px; }
  .cap {
    color:rgba(255,255,255,.85); font-size:12.5px; letter-spacing:2px;
    text-align:center; margin:0 0 14px; display:flex; align-items:center; gap:10px;
  }
  .cap::before,.cap::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent); }
  .card {
    display:flex; align-items:center; gap:14px;
    background:#fff; border-radius:16px; padding:17px 15px;
    margin-bottom:14px; text-decoration:none; color:inherit;
    box-shadow:0 4px 16px rgba(13,71,131,.10);
    border:1px solid rgba(0,91,172,.06);
    opacity:0; transform:translateY(14px);
    animation:in .5s cubic-bezier(.22,.9,.36,1) forwards;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:nth-child(2) { animation-delay:.10s; }
  .card:nth-child(3) { animation-delay:.20s; }
  .card:nth-child(4) { animation-delay:.30s; }
  @keyframes in { to { opacity:1; transform:none; } }
  .card:active { transform:scale(.975); box-shadow:0 2px 8px rgba(13,71,131,.14); }
  .icon {
    flex:none; width:56px; height:56px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.13);
  }
  .icon svg { width:30px; height:30px; }
  .info { flex:1; min-width:0; }
  .t { font-size:16.5px; font-weight:700; color:#17324f; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .tag {
    font-size:10.5px; font-weight:600; letter-spacing:.5px; color:#fff;
    padding:2px 8px; border-radius:999px; opacity:.92; white-space:nowrap;
  }
  .d { margin-top:5px; font-size:12.5px; color:#68798c; line-height:1.5; }
  .arrow { flex:none; color:#b8c7d8; font-size:22px; font-weight:300; }
  /* ── 底部落款 ── */
  footer { text-align:center; padding:6px 16px calc(20px + env(safe-area-inset-bottom)); }
  footer .co { font-size:13px; color:#33517a; font-weight:600; letter-spacing:1px; }
  footer .dept { font-size:11.5px; color:#7a8ba0; margin-top:4px; letter-spacing:3px; }
  footer .ver { font-size:10.5px; color:#a8b6c6; margin-top:8px; letter-spacing:1px; }
</style>
</head>
